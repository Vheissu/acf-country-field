name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: composer test

  # The plugin supports PHP 8.0, but the test tools no longer install on it.
  syntax:
    name: PHP 8.0 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - run: find acf-country-field.php autoload.php uninstall.php src data -name '*.php' -print0 | xargs -0 -n1 php -l

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: composer phpcs

      - run: composer phpstan
